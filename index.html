  <script>
    /* Decide antes del primer pintado si corre la intro. Se omite con reduced-motion o ?nointro. */
    (function () {
      var root = document.documentElement, play = true;
      try {
        if (matchMedia('(prefers-reduced-motion: reduce)').matches) play = false;
        if (location.search.indexOf('nointro') !== -1) play = false;
      } catch (e) {}
      root.classList.add(play ? 'intro-on' : 'is-ready');
    })();
  </script>
  <link rel="preload" href="assets/fonts/satoshi/Satoshi-Variable.woff2" as="font" type="font/woff2" crossorigin>

  <link rel="stylesheet" href="styles.css?v=13">
</head>

  <!-- Intro: hexágono gira, las letras salen del logo y el lockup viaja a la barra superior -->

        <span class="logo__letters">

          <span class="ltr" style="--x:137;--w:101"></span>
          <span class="ltr" style="--x:238;--w:128"></span>
          <span class="ltr" style="--x:366;--w:75"></span>
          <span class="ltr" style="--x:441;--w:75"></span>
          <span class="ltr" style="--x:516;--w:128"></span>
          <span class="ltr" style="--x:644;--w:116"></span>

    </div>
  </div>

      <a class="nav__brand" href="#top" aria-label="Atelier Workshop">

      </a>
      <nav class="nav__links" aria-label="Principal">

        <a href="#como" data-i18n="nav.how">Cómo funciona</a>
        <a href="#roles" data-i18n="nav.roles">Roles</a>
        <a href="#precios" data-i18n="nav.pricing">Precios</a>
        <a href="#faq" data-i18n="nav.faq">Preguntas</a>
        <a href="#equipo" data-i18n="nav.team">Equipo</a>
      </nav>
      <div class="nav__actions">
        <button class="nav__ctrl lang-toggle" id="langToggle" aria-label="Cambiar idioma" title="ES / EN">
          <span class="lang-opt lang-opt--es is-active">ES</span>
          <span class="lang-sep">/</span>
          <span class="lang-opt lang-opt--en">EN</span>
        </button>
        <button class="nav__ctrl theme-toggle" id="themeToggle" aria-label="Cambiar tema claro/oscuro" title="Tema">
          <i class="ph ph-sun light-only"></i>
          <i class="ph ph-moon dark-only"></i>
        </button>
        <button class="btn btn--primary btn--sm nav__demo-btn" data-open-modal="demo" data-plan="pro" data-i18n="nav.demo">Pedir Demo</button>

          <i class="ph ph-list"></i>

    </div>

      <nav class="mobile-drawer__links">
